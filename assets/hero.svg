<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-label="Brian Mbuya — Full-stack engineer, applied AI, reliability. Open to work. initializing brian-mbuya: frontend 96%, backend 93%, applied AI 88%. Building things that actually ship.">
  <defs>
    <clipPath id="frame"><rect x="0" y="0" width="1000" height="460" rx="4"/></clipPath>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#c4b5fd"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" x2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <radialGradient id="panelGlow" cx="80%" cy="60%" r="60%"><stop offset="0" stop-color="#5b21b6" stop-opacity="0.22"/><stop offset="1" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <pattern id="segFill" patternUnits="userSpaceOnUse" width="12" height="16"><rect width="9" height="16" rx="2" fill="url(#barGrad)"/></pattern>
    <pattern id="segTrack" patternUnits="userSpaceOnUse" width="12" height="16"><rect width="9" height="16" rx="2" fill="#221d38"/></pattern>
    <filter id="pglow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>

    <clipPath id="cl1"><rect x="66" y="190" width="0" height="28"><animate attributeName="width" from="0" to="360" begin="0.2s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="cb1"><rect x="204" y="232" width="0" height="16"><animate attributeName="width" from="0" to="288" begin="0.7s" dur="1.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="cb2"><rect x="204" y="270" width="0" height="16"><animate attributeName="width" from="0" to="279" begin="0.9s" dur="1.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="cb3"><rect x="204" y="308" width="0" height="16"><animate attributeName="width" from="0" to="264" begin="1.1s" dur="1.3s" fill="freeze"/></rect></clipPath>

    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif}
      .cursor{animation:blink 1.05s step-end infinite}
      @keyframes blink{50%{opacity:0}}
      .march{stroke-dasharray:11 8;animation:march 1.1s linear infinite}
      @keyframes march{to{stroke-dashoffset:-38}}
      .spin{transform-box:fill-box;transform-origin:center;animation:spin 42s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      .tw{animation:tw 3s ease-in-out infinite}
      @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
      .brk{animation:brk 2.6s ease-in-out infinite}
      @keyframes brk{0%,100%{opacity:.4}50%{opacity:.9}}
      .live{animation:brk 1.6s ease-in-out infinite}
      @media (prefers-reduced-motion: reduce){
        .cursor,.march,.spin,.tw,.brk,.live{animation:none !important}
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="460" fill="#0a0812"/>
    <ellipse cx="820" cy="300" rx="360" ry="220" fill="url(#panelGlow)"/>

    <!-- name row -->
    <text class="sans" x="40" y="70" fill="url(#nameGrad)" font-size="50" font-weight="800" letter-spacing="-1.6">Brian Mbuya</text>
    <text class="mono" x="43" y="100" fill="#9a8ccb" font-size="13.5" letter-spacing="3">FULL-STACK ENGINEER · APPLIED AI · RELIABILITY</text>
    <g>
      <rect x="806" y="48" width="156" height="30" rx="15" fill="#0e2a1c" stroke="#1f7a4d"/>
      <circle class="live" cx="826" cy="63" r="4.5" fill="#34d399" filter="url(#pglow)"/>
      <text class="mono" x="840" y="67" fill="#6ee7b0" font-size="12" letter-spacing="1.5">OPEN TO WORK</text>
    </g>

    <!-- dashed animated frame -->
    <rect class="march" x="32" y="126" width="936" height="306" rx="16" fill="none" stroke="#7c3aed" stroke-width="1.6" opacity="0.85"/>
    <!-- panel -->
    <rect x="40" y="134" width="920" height="290" rx="13" fill="#0c0a16" stroke="#241d3a"/>
    <rect x="40" y="134" width="920" height="46" rx="13" fill="#100c1e"/>
    <rect x="40" y="168" width="920" height="12" fill="#100c1e"/>

    <!-- traffic dots + title -->
    <circle cx="70" cy="157" r="6" fill="#ff5f56"/><circle cx="92" cy="157" r="6" fill="#ffbd2e"/><circle cx="114" cy="157" r="6" fill="#27c93f"/>
    <text class="mono" x="140" y="161" fill="#5a5372" font-size="12">brian-mbuya — ~/profile</text>

    <!-- corner brackets -->
    <g class="brk" stroke="#a78bfa" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M58 206 v-16 h16"/><path d="M942 206 v-16 h-16"/>
      <path d="M58 402 v16 h16"/><path d="M942 402 v16 h-16"/>
    </g>

    <!-- line 1: typing -->
    <g clip-path="url(#cl1)">
      <text class="mono" x="66" y="212" font-size="18"><tspan fill="#a78bfa">&gt;</tspan><tspan fill="#e9e6f5"> initializing brian-mbuya</tspan></text>
    </g>
    <rect class="cursor" x="356" y="198" width="10" height="17" fill="#a78bfa"/>

    <!-- progress bars -->
    <g class="mono" font-size="13" letter-spacing="1.5">
      <text x="72" y="245" fill="#8b86a3">FRONTEND</text>
      <rect x="204" y="232" width="288" height="16" fill="url(#segTrack)"/>
      <rect x="204" y="232" width="288" height="16" fill="url(#segFill)" filter="url(#pglow)" clip-path="url(#cb1)"/>
      <text x="512" y="245" fill="#c4b5fd">96%</text>

      <text x="72" y="283" fill="#8b86a3">BACKEND</text>
      <rect x="204" y="270" width="288" height="16" fill="url(#segTrack)"/>
      <rect x="204" y="270" width="279" height="16" fill="url(#segFill)" filter="url(#pglow)" clip-path="url(#cb2)"/>
      <text x="512" y="283" fill="#c4b5fd">93%</text>

      <text x="72" y="321" fill="#8b86a3">APPLIED AI</text>
      <rect x="204" y="308" width="288" height="16" fill="url(#segTrack)"/>
      <rect x="204" y="308" width="264" height="16" fill="url(#segFill)" filter="url(#pglow)" clip-path="url(#cb3)"/>
      <text x="512" y="321" fill="#c4b5fd">88%</text>
    </g>

    <!-- line 2 -->
    <text class="mono" x="66" y="376" font-size="16"><tspan fill="#a78bfa">&gt;</tspan><tspan fill="#b9b2d6"> building things that actually ship</tspan></text>
    <rect class="cursor" x="438" y="363" width="9" height="16" fill="#a78bfa"/>

    <!-- particle globe -->
    <g transform="translate(792,292)">
      <circle r="94" fill="none" stroke="#2a2244" stroke-width="1"/>
      <circle r="94" class="tw" fill="none" stroke="#7c3aed" stroke-width="1" stroke-dasharray="1 10" stroke-linecap="round" opacity="0.5"/>
      <g class="spin" stroke="#8b5cf6" fill="none" stroke-linecap="round">
        <ellipse rx="30" ry="94" stroke-width="1" stroke-dasharray="1 8" opacity="0.55"/>
        <ellipse rx="62" ry="94" stroke-width="1" stroke-dasharray="1 9" opacity="0.4"/>
        <ellipse rx="88" ry="94" stroke-width="1" stroke-dasharray="1 10" opacity="0.3"/>
      </g>
      <g stroke="#7c6bb0" fill="none" stroke-linecap="round" stroke-width="1" stroke-dasharray="1 9">
        <ellipse rx="94" ry="30" opacity="0.5"/>
        <ellipse rx="90" ry="60" opacity="0.35"/>
      </g>
      <g fill="#c4b5fd">
        <circle class="tw" cx="-40" cy="-58" r="2.2"/>
        <circle class="tw" cx="52" cy="-30" r="2" style="animation-delay:.6s"/>
        <circle class="tw" cx="30" cy="60" r="2.4" style="animation-delay:1.1s"/>
        <circle class="tw" cx="-62" cy="24" r="2" style="animation-delay:1.7s"/>
        <circle class="tw" cx="70" cy="40" r="1.8" style="animation-delay:.3s"/>
        <circle class="tw" cx="-10" cy="-84" r="2" style="animation-delay:2.2s"/>
        <circle class="tw" cx="14" cy="10" r="2.6" fill="#e9e6f5"/>
      </g>
      <circle r="3.4" fill="#e9e6f5" filter="url(#pglow)">
        <animateMotion dur="7s" repeatCount="indefinite" path="M0,-94 A94,94 0 1 1 0,94 A94,94 0 1 1 0,-94"/>
      </circle>
    </g>
  </g>
</svg>
