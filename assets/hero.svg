<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 372" role="img" aria-label="Terminal. brian@nairobi ~ % whoami — Brian Mbuya, full-stack engineer, Nairobi, UTC+3. cat approach.md — I build for the failure case, not the happy path (yes, it also works in production, not just on my machine). ./status --now — shipping Chuka Hostels, real students, real M-Pesa. Open to work.">
  <defs>
    <clipPath id="win"><rect x="8" y="8" width="844" height="356" rx="10"/></clipPath>
    <style>
      .m{font-family:ui-monospace,SFMono-Regular,"Cascadia Code",Menlo,Consolas,monospace;font-size:16px}
      .prompt{fill:#e3b341}.host{fill:#8b949e}.cmd{fill:#e6edf3}.out{fill:#adbac7}
      .cmt{fill:#d29922}.arrow{fill:#e3b341}.name{fill:#f0f6fc;font-weight:600}
      .ln{animation:appear .4s ease both;transform-box:fill-box}
      @keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
      .cur{fill:#e3b341;animation:blink 1.06s step-end infinite}
      @keyframes blink{50%{opacity:0}}
      @media (prefers-reduced-motion:reduce){.ln{animation:none}.cur{animation:none}}
    </style>
  </defs>

  <rect x="8.5" y="8.5" width="843" height="355" rx="10" fill="#0d1117" stroke="#30363d"/>
  <g clip-path="url(#win)">
    <rect x="8" y="8" width="844" height="40" fill="#161b22"/>
    <line x1="8" y1="48" x2="852" y2="48" stroke="#30363d"/>
    <circle cx="34" cy="28" r="6" fill="#f85149"/><circle cx="55" cy="28" r="6" fill="#d29922"/><circle cx="76" cy="28" r="6" fill="#3fb950"/>
    <text x="430" y="33" text-anchor="middle" class="m" fill="#6e7681" font-size="13">brian@nairobi: ~/dev — zsh</text>

    <text class="m ln" x="32" y="90"><tspan class="prompt">brian@nairobi</tspan><tspan class="host"> ~ %</tspan><tspan class="cmd"> whoami</tspan></text>
    <text class="m ln" x="32" y="116" style="animation-delay:.25s"><tspan class="name">Brian Mbuya</tspan><tspan class="out"> — full-stack engineer · Nairobi · UTC+3</tspan></text>

    <text class="m ln" x="32" y="160" style="animation-delay:.6s"><tspan class="prompt">brian@nairobi</tspan><tspan class="host"> ~ %</tspan><tspan class="cmd"> cat approach.md</tspan></text>
    <text class="m ln cmt" x="32" y="186" style="animation-delay:.85s">// build for the failure case, not the happy path</text>
    <text class="m ln cmt" x="32" y="208" style="animation-delay:1.05s" fill="#6e7681">// (yes, it also works in production — not just on my machine)</text>

    <text class="m ln" x="32" y="252" style="animation-delay:1.4s"><tspan class="prompt">brian@nairobi</tspan><tspan class="host"> ~ %</tspan><tspan class="cmd"> ./status --now</tspan></text>
    <text class="m ln" x="32" y="278" style="animation-delay:1.65s"><tspan class="arrow">▸</tspan><tspan class="out"> shipping </tspan><tspan class="name">Chuka Hostels</tspan><tspan class="out"> — real students, real M-Pesa</tspan></text>
    <text class="m ln" x="32" y="304" style="animation-delay:1.9s"><tspan class="arrow">▸</tspan><tspan class="out"> open to work</tspan></text>
    <rect class="cur" x="178" y="292" width="9" height="16"/>
  </g>
</svg>
