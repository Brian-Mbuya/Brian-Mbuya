<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 590" role="img" aria-label="Brian Mbuya — Full-stack engineer, applied AI, reliability. Open to work. Frontend 96%, Backend 93%, Applied AI 88%. Building things that actually ship.">
  <defs>
    <clipPath id="mframe"><rect x="0" y="0" width="520" height="590" rx="4"/></clipPath>
    <linearGradient id="mName" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#c4b5fd"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="mBar" x1="0" x2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <radialGradient id="mGlow" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#5b21b6" stop-opacity="0.28"/><stop offset="1" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <pattern id="mSegF" patternUnits="userSpaceOnUse" width="12" height="16"><rect width="9" height="16" rx="2" fill="url(#mBar)"/></pattern>
    <pattern id="mSegT" patternUnits="userSpaceOnUse" width="12" height="16"><rect width="9" height="16" rx="2" fill="#221d38"/></pattern>
    <filter id="mPg" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="mcb1"><rect x="160" y="258" width="0" height="16"><animate attributeName="width" from="0" to="259" begin="0.6s" dur="1.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="mcb2"><rect x="160" y="294" width="0" height="16"><animate attributeName="width" from="0" to="251" begin="0.8s" dur="1.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="mcb3"><rect x="160" y="330" width="0" height="16"><animate attributeName="width" from="0" to="238" begin="1.0s" dur="1.3s" fill="freeze"/></rect></clipPath>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif}
      .cursor{animation:blink 1.05s step-end infinite}@keyframes blink{50%{opacity:0}}
      .march{stroke-dasharray:11 8;animation:march 1.1s linear infinite}@keyframes march{to{stroke-dashoffset:-38}}
      .spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
      .tw{animation:tw 3s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.3}50%{opacity:1}}
      .live{animation:tw 1.6s ease-in-out infinite}
      @media (prefers-reduced-motion: reduce){.cursor,.march,.spin,.tw,.live{animation:none!important}}
    </style>
  </defs>
  <g clip-path="url(#mframe)">
    <rect width="520" height="590" fill="#0a0812"/>
    <ellipse cx="260" cy="520" rx="220" ry="150" fill="url(#mGlow)"/>

    <!-- open to work -->
    <g><rect x="312" y="26" width="184" height="32" rx="16" fill="#0e2a1c" stroke="#1f7a4d"/>
      <circle class="live" cx="334" cy="42" r="4.5" fill="#34d399" filter="url(#mPg)"/>
      <text class="mono" x="349" y="46" fill="#6ee7b0" font-size="12" letter-spacing="1.4">OPEN TO WORK</text></g>

    <!-- name -->
    <text class="sans" x="26" y="104" fill="url(#mName)" font-size="46" font-weight="800" letter-spacing="-1.4">Brian Mbuya</text>
    <text class="mono" x="28" y="134" fill="#9a8ccb" font-size="12.5" letter-spacing="2">FULL-STACK · APPLIED AI · RELIABILITY</text>

    <!-- dashed frame + panel -->
    <rect class="march" x="16" y="156" width="488" height="288" rx="16" fill="none" stroke="#7c3aed" stroke-width="1.6" opacity="0.85"/>
    <rect x="24" y="164" width="472" height="272" rx="13" fill="#0c0a16" stroke="#241d3a"/>
    <rect x="24" y="164" width="472" height="44" rx="13" fill="#100c1e"/><rect x="24" y="196" width="472" height="12" fill="#100c1e"/>
    <circle cx="52" cy="187" r="6" fill="#ff5f56"/><circle cx="74" cy="187" r="6" fill="#ffbd2e"/><circle cx="96" cy="187" r="6" fill="#27c93f"/>
    <text class="mono" x="120" y="191" fill="#5a5372" font-size="12">brian-mbuya</text>

    <!-- line 1 -->
    <text class="mono" x="46" y="240" font-size="16"><tspan fill="#a78bfa">&gt;</tspan><tspan fill="#e9e6f5"> initializing brian-mbuya</tspan></text>
    <rect class="cursor" x="356" y="227" width="9" height="16" fill="#a78bfa"/>

    <!-- bars -->
    <g class="mono" font-size="13" letter-spacing="1.2">
      <text x="46" y="270" fill="#8b86a3">FRONTEND</text>
      <rect x="160" y="258" width="259" height="16" fill="url(#mSegT)"/>
      <rect x="160" y="258" width="259" height="16" fill="url(#mSegF)" filter="url(#mPg)" clip-path="url(#mcb1)"/>
      <text x="432" y="270" fill="#c4b5fd">96%</text>
      <text x="46" y="306" fill="#8b86a3">BACKEND</text>
      <rect x="160" y="294" width="259" height="16" fill="url(#mSegT)"/>
      <rect x="160" y="294" width="251" height="16" fill="url(#mSegF)" filter="url(#mPg)" clip-path="url(#mcb2)"/>
      <text x="432" y="306" fill="#c4b5fd">93%</text>
      <text x="46" y="342" fill="#8b86a3">APPLIED AI</text>
      <rect x="160" y="330" width="259" height="16" fill="url(#mSegT)"/>
      <rect x="160" y="330" width="238" height="16" fill="url(#mSegF)" filter="url(#mPg)" clip-path="url(#mcb3)"/>
      <text x="432" y="342" fill="#c4b5fd">88%</text>
    </g>

    <!-- line 2 -->
    <text class="mono" x="46" y="404" font-size="15"><tspan fill="#a78bfa">&gt;</tspan><tspan fill="#b9b2d6"> building things that actually ship</tspan></text>
    <rect class="cursor" x="420" y="392" width="8" height="15" fill="#a78bfa"/>

    <!-- compact globe -->
    <g transform="translate(260,516)">
      <circle r="60" fill="none" stroke="#2a2244" stroke-width="1"/>
      <g class="spin" stroke="#8b5cf6" fill="none" stroke-linecap="round">
        <ellipse rx="20" ry="60" stroke-width="1" stroke-dasharray="1 7" opacity="0.55"/>
        <ellipse rx="42" ry="60" stroke-width="1" stroke-dasharray="1 8" opacity="0.4"/>
        <ellipse rx="57" ry="60" stroke-width="1" stroke-dasharray="1 9" opacity="0.28"/>
      </g>
      <g stroke="#7c6bb0" fill="none" stroke-linecap="round" stroke-width="1" stroke-dasharray="1 8">
        <ellipse rx="60" ry="20" opacity="0.5"/><ellipse rx="57" ry="40" opacity="0.32"/>
      </g>
      <g fill="#c4b5fd">
        <circle class="tw" cx="-26" cy="-38" r="2"/><circle class="tw" cx="34" cy="-18" r="1.8" style="animation-delay:.6s"/>
        <circle class="tw" cx="18" cy="40" r="2.2" style="animation-delay:1.1s"/><circle class="tw" cx="-40" cy="16" r="1.8" style="animation-delay:1.6s"/>
        <circle cx="8" cy="6" r="2.4" fill="#e9e6f5"/>
      </g>
      <circle r="3" fill="#e9e6f5" filter="url(#mPg)"><animateMotion dur="6s" repeatCount="indefinite" path="M0,-60 A60,60 0 1 1 0,60 A60,60 0 1 1 0,-60"/></circle>
    </g>
  </g>
</svg>
